security:
- hmac: []
tags:
- name: '#X Amz Target=ACMPrivateCA.DescribeCertificateAuthorityAuditReport'
paths:
  /#X-Amz-Target=ACMPrivateCA.DescribeCertificateAuthorityAuditReport:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeCertificateAuthorityAuditReport
      description: Lists information about a specific audit report created by calling the CreateCertificateAuthorityAuditReport action. Audit information is created every time the certificate authority (CA) private key is used. The private key is used when you call the IssueCertificate action or the RevokeCertificate action.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeCertificateAuthorityAuditReportResponse'
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '481':
          description: InvalidArnException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArnException'
        '482':
          description: InvalidArgsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgsException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeCertificateAuthorityAuditReportRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - ACMPrivateCA.DescribeCertificateAuthorityAuditReport
      summary: Amazon Private CA Describe Certificate Authority Audit Report
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=ACMPrivateCA.DescribeCertificateAuthorityAuditReport'
components:
  schemas:
    S3BucketName:
      type: string
      minLength: 3
      maxLength: 63
    DescribeCertificateAuthorityAuditReportRequest:
      type: object
      required:
      - CertificateAuthorityArn
      - AuditReportId
      title: DescribeCertificateAuthorityAuditReportRequest
      properties:
        CertificateAuthorityArn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: <p>The Amazon Resource Name (ARN) of the private CA. This must be of the form:</p> <p> <code>arn:aws:acm-pca:<i>region</i>:<i>account</i>:certificate-authority/<i>12345678-1234-1234-1234-123456789012</i> </code>. </p>
        AuditReportId:
          allOf:
          - $ref: '#/components/schemas/AuditReportId'
          - description: The report ID returned by calling the <a href="https://docs.aws.amazon.com/privateca/latest/APIReference/API_CreateCertificateAuthorityAuditReport.html">CreateCertificateAuthorityAuditReport</a> action.
    InvalidArgsException: {}
    DescribeCertificateAuthorityAuditReportResponse:
      type: object
      properties:
        AuditReportStatus:
          allOf:
          - $ref: '#/components/schemas/AuditReportStatus'
          - description: Specifies whether report creation is in progress, has succeeded, or has failed.
        S3BucketName:
          allOf:
          - $ref: '#/components/schemas/S3BucketName'
          - description: Name of the S3 bucket that contains the report.
        S3Key:
          allOf:
          - $ref: '#/components/schemas/S3Key'
          - description: S3 <b>key</b> that uniquely identifies the report file in your S3 bucket.
        CreatedAt:
          allOf:
          - $ref: '#/components/schemas/TStamp'
          - description: The date and time at which the report was created.
    Arn:
      type: string
      pattern: arn:[\w+=/,.@-]+:[\w+=/,.@-]+:[\w+=/,.@-]*:[0-9]*:[\w+=,.@-]+(/[\w+=,.@-]+)*
      minLength: 5
      maxLength: 200
    AuditReportStatus:
      type: string
      enum:
      - CREATING
      - SUCCESS
      - FAILED
    TStamp:
      type: string
      format: date-time
    InvalidArnException: {}
    ResourceNotFoundException: {}
    AuditReportId:
      type: string
      pattern: '[a-z0-9]{8}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{12}'
      minLength: 36
      maxLength: 36
    S3Key:
      type: string
      maxLength: 1024
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/acm-pca/
