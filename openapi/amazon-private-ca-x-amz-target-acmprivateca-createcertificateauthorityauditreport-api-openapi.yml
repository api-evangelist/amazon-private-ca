security:
- hmac: []
tags:
- name: '#X Amz Target=ACMPrivateCA.CreateCertificateAuthorityAuditReport'
paths:
  /#X-Amz-Target=ACMPrivateCA.CreateCertificateAuthorityAuditReport:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateCertificateAuthorityAuditReport
      description: 'Creates an audit report that lists every time that your CA private key is used. The report is saved in the Amazon S3 bucket that you specify on input. The IssueCertificate and RevokeCertificate actions use the private key.


        Both Amazon Web Services Private CA and the IAM principal must have permission to write to the S3 bucket that you specify. If the IAM principal making the call does not have permission to write to the bucket, then an exception is thrown. For more information, see Access policies for CRLs in Amazon S3.


        Amazon Web Services Private CA assets that are stored in Amazon S3 can be protected with encryption. For more information, see Encrypting Your Audit Reports.


        You can generate a maximum of one report every 30 minutes.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCertificateAuthorityAuditReportResponse'
        '480':
          description: RequestInProgressException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestInProgressException'
        '481':
          description: RequestFailedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestFailedException'
        '482':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '483':
          description: InvalidArnException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArnException'
        '484':
          description: InvalidArgsException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArgsException'
        '485':
          description: InvalidStateException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidStateException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCertificateAuthorityAuditReportRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - ACMPrivateCA.CreateCertificateAuthorityAuditReport
      summary: Amazon Private CA Create Certificate Authority Audit Report
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=ACMPrivateCA.CreateCertificateAuthorityAuditReport'
components:
  schemas:
    InvalidArgsException: {}
    RequestInProgressException: {}
    ResourceNotFoundException: {}
    Arn:
      type: string
      pattern: arn:[\w+=/,.@-]+:[\w+=/,.@-]+:[\w+=/,.@-]*:[0-9]*:[\w+=,.@-]+(/[\w+=,.@-]+)*
      minLength: 5
      maxLength: 200
    RequestFailedException: {}
    InvalidArnException: {}
    AuditReportId:
      type: string
      pattern: '[a-z0-9]{8}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{12}'
      minLength: 36
      maxLength: 36
    S3Key:
      type: string
      maxLength: 1024
    S3BucketName:
      type: string
      minLength: 3
      maxLength: 63
    CreateCertificateAuthorityAuditReportResponse:
      type: object
      properties:
        AuditReportId:
          allOf:
          - $ref: '#/components/schemas/AuditReportId'
          - description: An alphanumeric string that contains a report identifier.
        S3Key:
          allOf:
          - $ref: '#/components/schemas/S3Key'
          - description: The <b>key</b> that uniquely identifies the report file in your S3 bucket.
    CreateCertificateAuthorityAuditReportRequest:
      type: object
      required:
      - CertificateAuthorityArn
      - S3BucketName
      - AuditReportResponseFormat
      title: CreateCertificateAuthorityAuditReportRequest
      properties:
        CertificateAuthorityArn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: <p>The Amazon Resource Name (ARN) of the CA to be audited. This is of the form:</p> <p> <code>arn:aws:acm-pca:<i>region</i>:<i>account</i>:certificate-authority/<i>12345678-1234-1234-1234-123456789012</i> </code>.</p>
        S3BucketName:
          allOf:
          - $ref: '#/components/schemas/S3BucketName'
          - description: The name of the S3 bucket that will contain the audit report.
        AuditReportResponseFormat:
          allOf:
          - $ref: '#/components/schemas/AuditReportResponseFormat'
          - description: The format in which to create the report. This can be either <b>JSON</b> or <b>CSV</b>.
    InvalidStateException: {}
    AuditReportResponseFormat:
      type: string
      enum:
      - JSON
      - CSV
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/acm-pca/
