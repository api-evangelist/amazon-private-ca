security:
- hmac: []
tags:
- name: '#X Amz Target=ACMPrivateCA.ImportCertificateAuthorityCertificate'
paths:
  /#X-Amz-Target=ACMPrivateCA.ImportCertificateAuthorityCertificate:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ImportCertificateAuthorityCertificate
      description: 'Imports a signed private CA certificate into Amazon Web Services Private CA. This action is used when you are using a chain of trust whose root is located outside Amazon Web Services Private CA. Before you can call this action, the following preparations must in place:


        In Amazon Web Services Private CA, call the CreateCertificateAuthority action to create the private CA that you plan to back with the imported certificate.


        Call the GetCertificateAuthorityCsr action to generate a certificate signing request (CSR).


        Sign the CSR using a root or intermediate CA hosted by either an on-premises PKI hierarchy or by a commercial CA.


        Create a certificate chain and copy the signed certificate and the certificate chain to your working directory.


        Amazon Web Services Private CA supports three scenarios for installing a CA certificate:


        Installing a certificate for a root CA hosted by Amazon Web Services Private CA.


        Installing a subordinate CA certificate whose parent authority is hosted by Amazon Web Services Private CA.


        Installing a subordinate CA certificate whose parent authority is externally hosted.


        The following additional requirements apply when you import a CA certificate.


        Only a self-signed certificate can be imported as a root CA.


        A self-signed certificate cannot be imported as a subordinate CA.


        Your certificate chain must not include the private CA certificate that you are importing.


        Your root CA must be the last certificate in your chain. The subordinate certificate, if any, that your root CA signed must be next to last. The subordinate certificate signed by the preceding subordinate CA must come next, and so on until your chain is built.


        The chain must be PEM-encoded.


        The maximum allowed size of a certificate is 32 KB.


        The maximum allowed size of a certificate chain is 2 MB.


        Enforcement of Critical Constraints


        Amazon Web Services Private CA allows the following extensions to be marked critical in the imported CA certificate or chain.


        Basic constraints (must be marked critical)


        Subject alternative names


        Key usage


        Extended key usage


        Authority key identifier


        Subject key identifier


        Issuer alternative name


        Subject directory attributes


        Subject information access


        Certificate policies


        Policy mappings


        Inhibit anyPolicy


        Amazon Web Services Private CA rejects the following extensions when they are marked critical in an imported CA certificate or chain.


        Name constraints


        Policy constraints


        CRL distribution points


        Authority information access


        Freshest CRL


        Any other extension'
      responses:
        '200':
          description: Success
        '480':
          description: ConcurrentModificationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConcurrentModificationException'
        '481':
          description: RequestInProgressException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestInProgressException'
        '482':
          description: RequestFailedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestFailedException'
        '483':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
        '484':
          description: InvalidArnException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidArnException'
        '485':
          description: InvalidRequestException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestException'
        '486':
          description: InvalidStateException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidStateException'
        '487':
          description: MalformedCertificateException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MalformedCertificateException'
        '488':
          description: CertificateMismatchException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateMismatchException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCertificateAuthorityCertificateRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - ACMPrivateCA.ImportCertificateAuthorityCertificate
      summary: Amazon Private CA Import Certificate Authority Certificate
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=ACMPrivateCA.ImportCertificateAuthorityCertificate'
components:
  schemas:
    ConcurrentModificationException: {}
    InvalidRequestException: {}
    RequestInProgressException: {}
    ResourceNotFoundException: {}
    Arn:
      type: string
      pattern: arn:[\w+=/,.@-]+:[\w+=/,.@-]+:[\w+=/,.@-]*:[0-9]*:[\w+=,.@-]+(/[\w+=,.@-]+)*
      minLength: 5
      maxLength: 200
    RequestFailedException: {}
    InvalidArnException: {}
    MalformedCertificateException: {}
    InvalidStateException: {}
    CertificateChainBlob:
      type: string
      minLength: 0
      maxLength: 2097152
    CertificateMismatchException: {}
    CertificateBodyBlob:
      type: string
      minLength: 1
      maxLength: 32768
    ImportCertificateAuthorityCertificateRequest:
      type: object
      required:
      - CertificateAuthorityArn
      - Certificate
      title: ImportCertificateAuthorityCertificateRequest
      properties:
        CertificateAuthorityArn:
          allOf:
          - $ref: '#/components/schemas/Arn'
          - description: '<p>The Amazon Resource Name (ARN) that was returned when you called <a href="https://docs.aws.amazon.com/privateca/latest/APIReference/API_CreateCertificateAuthority.html">CreateCertificateAuthority</a>. This must be of the form: </p> <p> <code>arn:aws:acm-pca:<i>region</i>:<i>account</i>:certificate-authority/<i>12345678-1234-1234-1234-123456789012</i> </code> </p>'
        Certificate:
          allOf:
          - $ref: '#/components/schemas/CertificateBodyBlob'
          - description: The PEM-encoded certificate for a private CA. This may be a self-signed certificate in the case of a root CA, or it may be signed by another CA that you control.
        CertificateChain:
          allOf:
          - $ref: '#/components/schemas/CertificateChainBlob'
          - description: <p>A PEM-encoded file that contains all of your certificates, other than the certificate you're importing, chaining up to your root CA. Your Amazon Web Services Private CA-hosted or on-premises root certificate is the last in the chain, and each certificate in the chain signs the one preceding. </p> <p>This parameter must be supplied when you import a subordinate CA. When you import a root CA, there is no chain.</p>
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
